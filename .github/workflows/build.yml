name: Build

on:
  push:
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-client
          path: build/libs/*.jar
      - name: Commit jar to dist/
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Built jar [skip ci]" || echo "nothing to commit"
          git push
